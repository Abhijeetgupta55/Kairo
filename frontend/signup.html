<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kairo Sign Up</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="kairo.css">
</head>

<body class="sign-body">

  <div class="sign-container">
    <div class="sign-left">
      <a href="login.html" class="sign-back-btn">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <h1>kairo.</h1>
    </div>


    <div class="sign-divider"></div>

    <div class="sign-right">
      <div class="sign-form-container">
        <h2>Create Account</h2>
        <p>Sign up to start organizing.</p>

        <div class="sign-input-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name">
        </div>

        <div class="sign-input-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="Enter your e-mail">
        </div>

        <div class="sign-input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password">
        </div>

        <div class="sign-input-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Re-enter your password">
        </div>

        <a href="dashboard.html" button class="sign-btn">Sign Up</button></a>

        <div class="sign-social-icons">
          <i class="fa-brands fa-google"></i>
          <i class="fa-brands fa-apple"></i>
          <i class="fa-brands fa-facebook-f"></i>
        </div>

        <div class="sign-signup">
          Already have an account? <a href="login.html">Sign In</a>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
