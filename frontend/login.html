<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kairo Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="kairo.css">
</head>

<body class="l-body">

  <div class="l-container">

    <div class="l-left">
      <a href="landing.html" class="l-back-btn">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <h1>kairo.</h1>
    </div>


    <div class="l-divider"></div>


    <div class="l-right">
      <h2>Welcome back!</h2>
      <p>Get ready to organize.</p>

      <div class="l-input-group">
        <label for="email">E-mail or phone number</label>
        <input type="text" id="email" placeholder="Type your e-mail or phone number">
      </div>

      <div class="l-input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Type your password">
      </div>

      <a href="dashboard.html" button class="l-btn">Sign In</button></a>

      <div class="l-social-login">or do it via other accounts</div>
      <div class="l-social-icons">
        <i class="fa-brands fa-google"></i>
        <i class="fa-brands fa-apple"></i>
        <i class="fa-brands fa-facebook-f"></i>
      </div>

      <div class="l-signup">
        Don’t have an account? <a href="signup.html">Sign Up</a>
      </div>
    </div>
  </div>

</body>

</html>
