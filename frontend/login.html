<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kairo Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      font-family: 'DM Sans', sans-serif;
    }

    .container {
      display: flex;
      width: 100%;
    }

    .left, .right {
      width: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background-image: 
        linear-gradient(to right, #e6e6e6 1px, transparent 1px),
        linear-gradient(to bottom, #e6e6e6 1px, transparent 1px);
      background-size: 25px 25px; /* Even grid */
    }

    /* Left panel */
    .left {
      background-color: #f5f5f5; /* Light grey tone */
    }

    .left h1 {
      font-size: 60px;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
    }

    /* Back button */
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 40px;
      height: 40px;
      border: 1px solid #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: white;
      transition: 0.3s;
    }

    .back-btn:hover {
      background: #eee;
    }

    /* Divider */
    .divider {
      width: 1px;
      background: #ccc;
    }

    /* Right panel */
    .right {
      background-color: #ffffff;
      justify-content: center;
      padding: 40px;
    }

    .right h2 {
      font-size: 28px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .right p {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    .input-group {
      width: 100%;
      margin-bottom: 15px;
    }

    .input-group label {
      font-size: 13px;
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-family: 'Poppins', sans-serif;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: none;
      background: #f0f4f8;
      border-radius: 6px;
      font-size: 14px;
    }

    .forgot {
      text-align: right;
      font-size: 12px;
      margin-top: -8px;
      margin-bottom: 20px;
      color: #666;
      cursor: pointer;
    }

    .btn {
  display: block;            /* ensure it behaves like a block */
  margin: 20px auto 0 auto; /* top margin creates space above, auto left/right centers */
  padding: 14px 0;           /* vertical padding, width is controlled by block */
  width: 60%;               /* optional: smaller than full width for better spacing */
  background: #000;
  color: #fff;
  border: none;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;        /* text inside button centered */
}

    .btn:hover {
      opacity: 0.9;
    }

    .social-login {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-bottom: 15px;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .social-icons i {
      font-size: 20px;
      border: 1px solid #ddd;
      border-radius: 50%;
      padding: 12px;
      cursor: pointer;
      transition: 0.3s;
    }

    .social-icons i:hover {
      background: #f5f5f5;
    }

    .signup {
      margin-top: 20px;
      font-size: 14px;
      color: #444;
    }

    .signup a {
      color: #000;
      font-weight: 600;
      text-decoration: none;
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Left section with logo + back button -->
    <div class="left">
      <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <h1>kairo.</h1>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Right section with login -->
    <div class="right">
      <h2>Welcome back!</h2>
      <p>Get ready to organize.</p>

      <div class="input-group">
        <label for="email">E-mail or phone number</label>
        <input type="text" id="email" placeholder="Type your e-mail or phone number">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Type your password">
      </div>

      <a href="dashboard.html" button class="btn">Sign In</button></a>

      <div class="social-login">or do it via other accounts</div>
      <div class="social-icons">
        <i class="fa-brands fa-google"></i>
        <i class="fa-brands fa-apple"></i>
        <i class="fa-brands fa-facebook-f"></i>
      </div>

      <div class="signup">
        Don’t have an account? <a href="signup.html">Sign Up</a>
      </div>
    </div>
  </div>

</body>
</html>
