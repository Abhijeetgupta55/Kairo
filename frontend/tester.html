<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header></header>
    <section></section>
    <script>
        let header = document.querySelector("header");  // webpage is divided into two parts
        // header tag is used to display image, school name and university name
       
        let section = document.querySelector("section")
        // section is used to display the details (branch name, eligibility criteria
        // and bulleted list of electives offered for rsepective branch) of different branches
       
        // this async function is used to access the json object by creating request object
        // and getting the response and updating the web page using header and section

        async function updateJSONPage()
        {
        //create request object
        let request = new Request("json/bmu.json");
        // fetch request for response
        let response = await fetch(request);
        // then get Json object using response
        let jsonobj= await response.json();
         console.log(JSON.stringify(jsonobj)); // to print and verify whether json object is accessible

         updateHeader(jsonobj);
         updateSection(jsonobj);
        }

        function updateHeader(jsonobj)
        {
            let img = document.createElement("img");
            img.src= jsonobj["bmuimg"];
            img.style.margin="0 auto";
            img.style.display="block";
            header.appendChild(img);

            let schl = document.createElement("h2");
            schl.textContent= jsonobj["school"];
            schl.style.textAlign="center";
            header.appendChild(schl);

            let uni = document.createElement("h1");
            uni.textContent = jsonobj["univ"];
            uni.style.textAlign="center";
            header.appendChild(uni);
              }
       
        function updateSection(jsonobj)
        {
        //  understanding arrays and accessing each element of array
            // let arr =['aaa', 'hhh','kkk' ];
        //     for( let ele of arr)
        // {
        //     console.log(ele);

        // }


        let branches = jsonobj["branches"];

        for(let branch of branches){

            // each branch element of branches array is collection of multiple key value pairs-> bname(sinlge //value), elig(single value), elec (array of values)



            let article = document.createElement("article")
            article.style.width="33%"
            article.style.float="left"
     
       // three articles are created for each branch, so 33% width for each article
            // understand why float:left property is used

            //1. access branch name and add it to article
            // remember your using . operator to access key from a collection using array element
           
           
            // let bname = branch.bname;
            // console.log(bname);

            let bname1 = document.createElement("h2");
            bname1.textContent = branch.bname;

            article.appendChild(bname1)
            section.appendChild(article)


            //1. access eligibility and add it to article

            let elig1 = document.createElement("h2");
            elig1 .textContent= "Eligibility:"+ branch.elig;
            article.appendChild(elig1);
            section.appendChild(article);


            //1. access electives and add it to article
            // for electives , key name is elec in json which is an array

            let elec1 = document.createElement ("h2");
            elec1.textContent ="Electives:"

            article.appendChild(elec1);
            section.appendChild(article);

            let ul = document.createElement("ul");

            let elecs = branch.elec;

            for (let elective of elecs )
        {
            let li = document.createElement("li");
            li.textContent = elective;
            ul.appendChild(li);

        }

        article.appendChild(ul);
        section.appendChild(article);


        }

        }

        updateJSONPage();

    </script>
</body>
</html>
